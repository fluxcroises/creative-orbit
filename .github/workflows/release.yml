# Construit et publie le lanceur, au choix :
#   - depuis l'onglet Actions → « Publier le lanceur » → Run workflow
#     (décocher « Publier » pour un essai : les installateurs restent
#     téléchargeables 7 jours sur la page de l'exécution, sans Release) ;
#   - ou en poussant une étiquette « v* » (ex. v0.2.0).
# La version publiée est celle de package.json. Windows et macOS sont construits
# en parallèle ; la Release « v<version> » n'est créée qu'à la fin, et seulement
# si les deux constructions ont réussi : jamais de Release incomplète.
name: Publier le lanceur

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publier:
        description: Créer la Release (décocher pour un simple essai)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Windows (installateur NSIS)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: macOS (signé et notarisé)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never
        env:
          # Certificat « Developer ID Application » exporté en .p12, encodé en base64
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarisation Apple
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: lanceur-${{ runner.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publier
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          ls -l dist
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "::error::La Release v$version existe déjà. Augmentez « version » dans package.json."
            exit 1
          fi
          # Étiquette déjà présente : on s'y rattache sans la déplacer (GitHub
          # refuse de déplacer une étiquette depuis une tâche automatique).
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > /dev/null 2>&1; then
            target=(--verify-tag)
          else
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "v$version" dist/* "${target[@]}" \
            --title "Creative Orbit $version" \
            --notes "Creative Orbit $version"
