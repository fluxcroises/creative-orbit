# Met à jour catalog/catalog.json à partir des dernières Releases des logiciels.
# Se lance toutes les 6 heures, à la main (onglet Actions), ou depuis le dépôt
# d'un logiciel après une nouvelle version (voir README, « repository_dispatch »).
name: Mettre à jour le catalogue

on:
  workflow_dispatch:
  repository_dispatch:
    types: [app-released]
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths: ['catalog/apps.json']

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer le catalogue
        run: node scripts/build-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enregistrer les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          if git diff --cached --quiet; then
            echo "Catalogue inchangé."
          else
            git commit -m "Catalogue : mise à jour automatique"
            git push
          fi
