<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'"
    />
    <title>Creative Orbit</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <img class="brand brand-dark" src="assets/brand/creative-orbit-logo-horizontal-sombre.svg" alt="Creative Orbit" />
        <img class="brand brand-light" src="assets/brand/creative-orbit-logo-horizontal-clair.svg" alt="Creative Orbit" />
        <span class="demo-pill" id="demo-pill" hidden></span>
        <div class="search">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          <input id="search" type="search" autocomplete="off" spellcheck="false" />
        </div>
        <button class="btn btn-icon" id="refresh" type="button">
          <svg class="icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66L20 8.7" /><path d="M20 3.5v5.2h-5.2" /></svg>
        </button>
      </header>

      <nav class="sidebar" id="sidebar"></nav>

      <main class="content" id="content" tabindex="-1"></main>
    </div>

    <div id="overlay-root"></div>
    <div class="sr-only" id="live" aria-live="polite"></div>

    <script src="i18n.js"></script>
    <script src="app.js"></script>
  </body>
</html>
